<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typing Fighter</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <section id="menu">
      <h1>Typing <span>Fighter</span></h1>
      <form id="start-form">
        <label for="command">Type <strong id="start-word">start</strong> and press Enter</label>
        <input id="command" type="text" placeholder="here" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="message">
        <p id="message" role="status"></p>
      </form>
    </section>
    <section id="arena" hidden>
      <h1>Arena</h1>
      <div class="player-health">
        <p>HP: <span id="player-hp">10</span></p>
        <div class="spell-indicators">
          <span id="player-fire">fire</span>
          <span id="player-air">air</span>
          <span id="player-electric">electric</span>
          <span id="player-water">water</span>
          <span id="player-rock">rock</span>
          <span id="player-cure">cure</span>
        </div>
      </div>
      <div class="enemy-health">
        <p>Enemy HP: <span id="enemy-hp"></span></p>
        <div class="spell-indicators">
          <span id="enemy-fire">fire</span>
          <span id="enemy-air">air</span>
          <span id="enemy-electric">electric</span>
          <span id="enemy-water">water</span>
          <span id="enemy-rock">rock</span>
          <span id="enemy-cure">cure</span>
        </div>
      </div>
      <p>Time left: <span id="timer"></span>s</p>
      <form id="spell-form">
        <label for="spell">Type a spell and press Enter</label>
        <input id="spell" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
      </form>
    </section>
  </main>
</body>
</html>

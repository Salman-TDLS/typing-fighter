<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typing Fighter</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <section id="menu">
      <h1>Typing <span>Fighter</span></h1>
      <form id="start-form">
        <label for="command">Type <strong id="start-word">start</strong> and press Enter</label>
        <input id="command" type="text" placeholder="here" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="message">
        <p id="message" role="status"></p>
      </form>
    </section>
  </main>
</body>
</html>
